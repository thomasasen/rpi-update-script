name: Publish Jellyfin Desktop v2.0.0 Windows R4 Release

on:
  push:
    branches:
      - build/jellyfin-desktop-v2.0.0
    paths:
      - ".github/workflows/publish-jellyfin-desktop-v2-release.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: jellyfin-desktop-v2.0.0-windows-x64-r4
      RELEASE_TITLE: Jellyfin Desktop v2.0.0 - Windows x64 R4 (Qt 6.9.3)
      BUILD_RUN_ID: "34649843255"

    steps:
      - name: Checkout release target
        uses: actions/checkout@v4

      - name: Ensure release does not already exist
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi

      - name: Download verified build artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$BUILD_RUN_ID" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "JellyfinDesktop-v2.0.0-windows-x64-r4" \
            --dir dist
          test -f "dist/JellyfinDesktop-2.0.0-windows-x64.exe"

      - name: Create SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum JellyfinDesktop-2.0.0-windows-x64.exe > JellyfinDesktop-2.0.0-windows-x64.exe.sha256
          cat JellyfinDesktop-2.0.0-windows-x64.exe.sha256
          INSTALLER_SHA256="$(cut -d' ' -f1 JellyfinDesktop-2.0.0-windows-x64.exe.sha256)"
          echo "INSTALLER_SHA256=$INSTALLER_SHA256" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Windows x64 R4 compatibility build of Jellyfin Desktop v2.0.0.

          R4 keeps the exact Jellyfin Desktop v2.0.0 source base and all compatibility fixes from R2/R3. The only additional functional change in R4 is the Qt toolchain update from 6.8.0 to 6.9.3.

          Build provenance:
          - Upstream repository: jellyfin/jellyfin-desktop
          - Base tag: v2.0.0
          - Base commit: 1634d3d263b881dccc62bf278d1289b471ec7af1
          - Version verified during the build: 2.0.0
          - Windows build fix from Jellyfin upstream commit 52d506767613e41a889c75e8bbaf00c51a29751b ("Working 2.0.0 build for Windows")
          - OpenGL/black-screen fix from Jellyfin upstream commit 8a5b0d4e4d55e2e85ab8334bf75cbc6fa386b5dc ("Fix OpenGL detect")
          - R3 compatibility fix retained: on Windows, QtWebEngine receives --disable-gpu by default; the existing MPV/OpenGL video path remains unchanged.
          - R4 change: Qt 6.8.0 -> Qt 6.9.3, using win64_msvc2022_64 with qtwebengine, qtwebchannel, and qtpositioning.
          - Qt version verified in the build log via qmake: 6.9.3
          - No libmpv update.
          - No additional feature backports.
          - Build workflow run: 34649843255
          - Installer SHA-256: $INSTALLER_SHA256

          This is an independently compiled Windows artifact, not an official binary published by the Jellyfin project.

          Files:
          - JellyfinDesktop-2.0.0-windows-x64.exe
          - JellyfinDesktop-2.0.0-windows-x64.exe.sha256
          EOF
          gh release create "$TAG" \
            "dist/JellyfinDesktop-2.0.0-windows-x64.exe" \
            "dist/JellyfinDesktop-2.0.0-windows-x64.exe.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md
