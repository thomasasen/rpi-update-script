name: Publish Jellyfin Desktop v2.0.0 Windows R3 Release

on:
  push:
    branches:
      - build/jellyfin-desktop-v2.0.0
    paths:
      - ".github/workflows/publish-jellyfin-desktop-v2-release.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: jellyfin-desktop-v2.0.0-windows-x64-r3
      RELEASE_TITLE: Jellyfin Desktop v2.0.0 - Windows x64 R3 (QtWebEngine flicker workaround)
      BUILD_RUN_ID: "34638629387"

    steps:
      - name: Checkout release target
        uses: actions/checkout@v4

      - name: Ensure release does not already exist
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi

      - name: Download verified build artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$BUILD_RUN_ID" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "JellyfinDesktop-v2.0.0-windows-x64-r3" \
            --dir dist
          test -f "dist/JellyfinDesktop-2.0.0-windows-x64.exe"

      - name: Create SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum JellyfinDesktop-2.0.0-windows-x64.exe > JellyfinDesktop-2.0.0-windows-x64.exe.sha256
          cat JellyfinDesktop-2.0.0-windows-x64.exe.sha256

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          Windows x64 R3 compatibility build of Jellyfin Desktop v2.0.0.

          R3 includes the Windows/OpenGL corrections from R2 and additionally disables GPU acceleration only for QtWebEngine on Windows. This targets intermittent UI flickering observed on Intel UHD Graphics 620, where launching R2 with Jellyfin Desktop's existing --disable-gpu option made the flicker disappear.

          The workaround does not disable MPV/OpenGL video rendering or force Jellyfin video playback to software decoding. It changes the Chromium/QtWebEngine UI rendering path only.

          Build provenance:
          - Upstream repository: jellyfin/jellyfin-desktop
          - Base tag: v2.0.0
          - Base commit: 1634d3d263b881dccc62bf278d1289b471ec7af1
          - Version verified during the build: 2.0.0
          - Windows build fixes derived from Jellyfin upstream commit 52d506767613e41a889c75e8bbaf00c51a29751b ("Working 2.0.0 build for Windows")
          - OpenGL/black-screen fix from Jellyfin upstream commit 8a5b0d4e4d55e2e85ab8334bf75cbc6fa386b5dc ("Fix OpenGL detect")
          - R3 compatibility change: on Windows, QtWebEngine receives --disable-gpu by default; the existing MPV/OpenGL path is unchanged.
          - Build workflow run: 34638629387
          - Build artifact digest: sha256:6cafad38934175f368e505e1b0e4094afe11b7c4633b6839667376a7744e022f

          This is an independently compiled Windows artifact, not an official binary published by the Jellyfin project.

          Files:
          - JellyfinDesktop-2.0.0-windows-x64.exe
          - JellyfinDesktop-2.0.0-windows-x64.exe.sha256
          EOF

          gh release create "$TAG" \
            "dist/JellyfinDesktop-2.0.0-windows-x64.exe" \
            "dist/JellyfinDesktop-2.0.0-windows-x64.exe.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md
