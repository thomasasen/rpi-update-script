name: Publish Jellyfin Desktop v2.0.0 Windows R5 Release

on:
  push:
    branches:
      - build/jellyfin-desktop-v2.0.0
    paths:
      - ".github/workflows/publish-jellyfin-desktop-v2-release.yml"

permissions:
  actions: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: jellyfin-desktop-v2.0.0-windows-x64-r5
      RELEASE_TITLE: Jellyfin Desktop v2.0.0 - Windows x64 R5 (QtWebEngine disk cache)
      RELEASE_TOKEN: ${{ secrets.RELEASE_WORKFLOW_TOKEN }}

    steps:
      - name: Checkout release target
        uses: actions/checkout@v4

      - name: Verify release target provenance
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "build/jellyfin-desktop-v2.0.0"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "Release tag will target branch commit ${GITHUB_SHA}"

      - name: Resolve latest successful R5 build run
        shell: bash
        run: |
          set -euo pipefail
          BUILD_RUN_ID="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?branch=build/jellyfin-desktop-v2.0.0&status=completed&per_page=100" \
            --jq '.workflow_runs[] | select(.name == "Build Jellyfin Desktop v2.0.0 Windows x64 R5" and .conclusion == "success") | .id' \
            | head -n 1)"
          test -n "$BUILD_RUN_ID"

          artifact_count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "JellyfinDesktop-v2.0.0-windows-x64-r5" and (.expired | not))] | length')"
          test "$artifact_count" -eq 1

          echo "BUILD_RUN_ID=$BUILD_RUN_ID" >> "$GITHUB_ENV"
          echo "Resolved latest successful build run: $BUILD_RUN_ID"
      - name: Check whether release already exists
        id: release-state
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; it will not be overwritten."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require workflow-capable release token
        if: steps.release-state.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TOKEN:-}" ]; then
            echo "::error::Repository secret RELEASE_WORKFLOW_TOKEN is required to tag a commit that contains workflow changes."
            echo "::error::Use a fine-grained PAT with Contents: Read and write and Workflows: Read and write for this repository."
            exit 1
          fi

      - name: Pin release tag to exact branch commit
        if: steps.release-state.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          TAG_API="repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG"
          EXISTING_SHA="$(gh api "$TAG_API" --jq '.object.sha' 2>/dev/null || true)"

          if [ -n "$EXISTING_SHA" ]; then
            test "$EXISTING_SHA" = "${GITHUB_SHA}"
            echo "Existing tag $TAG already points to ${GITHUB_SHA}"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="${GITHUB_SHA}" >/dev/null
          fi

          ACTUAL_SHA="$(gh api "$TAG_API" --jq '.object.sha')"
          test "$ACTUAL_SHA" = "${GITHUB_SHA}"
          echo "Verified tag $TAG -> $ACTUAL_SHA"

      - name: Download verified build artifact
        if: steps.release-state.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$BUILD_RUN_ID" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "JellyfinDesktop-v2.0.0-windows-x64-r5" \
            --dir dist
          test -f "dist/JellyfinDesktop-2.0.0-windows-x64.exe"

      - name: Create SHA-256 checksum
        if: steps.release-state.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum JellyfinDesktop-2.0.0-windows-x64.exe > JellyfinDesktop-2.0.0-windows-x64.exe.sha256
          cat JellyfinDesktop-2.0.0-windows-x64.exe.sha256
          INSTALLER_SHA256="$(cut -d' ' -f1 JellyfinDesktop-2.0.0-windows-x64.exe.sha256)"
          echo "INSTALLER_SHA256=$INSTALLER_SHA256" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        if: steps.release-state.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Windows x64 R5 compatibility build of Jellyfin Desktop v2.0.0.

          R5 keeps the exact Jellyfin Desktop v2.0.0 source base and all Windows/OpenGL/QtWebEngine compatibility fixes from the previous revisions. The only additional functional change in R5 is the conservative QtWebEngine disk-cache backport and separation of cache from persistent WebEngine storage.

          Build provenance:
          - Upstream repository: jellyfin/jellyfin-desktop
          - Base tag: v2.0.0
          - Base commit: 1634d3d263b881dccc62bf278d1289b471ec7af1
          - Version verified during the build: 2.0.0
          - Windows build fix from Jellyfin upstream commit 52d506767613e41a889c75e8bbaf00c51a29751b ("Working 2.0.0 build for Windows")
          - OpenGL/black-screen fix from Jellyfin upstream commit 8a5b0d4e4d55e2e85ab8334bf75cbc6fa386b5dc ("Fix OpenGL detect")
          - R3 compatibility fix retained: on Windows, QtWebEngine receives --disable-gpu by default; the existing MPV/OpenGL video path remains unchanged.
          - R4 Qt toolchain retained: Qt 6.9.3, win64_msvc2022_64, with qtwebengine, qtwebchannel, and qtpositioning.
          - Qt version verified in the build log via qmake: 6.9.3
          - R5 upstream basis: 065037270134d2769c92f58ebf2882638a0e9d21 ("Use disk HTTP cache instead of memory cache")
          - R5 upstream basis: 47d055a929ee8633a4b7c6a150d4e17847104fa0 ("Use separate cache and data paths for WebEngine profile")
          - R5 change: QtWebEngine uses DiskHttpCache instead of MemoryHttpCache.
          - R5 change: HTTP cache uses Paths::cacheDir("QtWebEngine"), while persistent WebEngine storage remains at Paths::dataDir("QtWebEngine").
          - Existing persistent WebEngine storage is not migrated or deleted; its data path is retained.
          - Expected practical effect: reusable WebUI resources can remain cached across restarts while persistent browser data stays separate from disposable cache data.
          - No libmpv update.
          - No additional feature backports.
          - Build workflow run: $BUILD_RUN_ID
          - Installer SHA-256: $INSTALLER_SHA256

          This is an independently compiled Windows artifact, not an official binary published by the Jellyfin project.

          Files:
          - JellyfinDesktop-2.0.0-windows-x64.exe
          - JellyfinDesktop-2.0.0-windows-x64.exe.sha256
          EOF
          gh release create "$TAG" \
            "dist/JellyfinDesktop-2.0.0-windows-x64.exe" \
            "dist/JellyfinDesktop-2.0.0-windows-x64.exe.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md

      - name: Verify durable release and delete source Actions artifact
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          installer_count="$(jq '[.assets[] | select((.name | ascii_downcase | endswith(".exe")) and (.size > 150000000))] | length' <<<"$release_json")"
          if [ "$installer_count" -lt 1 ]; then
            echo "::error::Release $TAG does not contain a durable installer asset larger than 150 MB."
            exit 1
          fi

          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}/artifacts?per_page=100")"
          artifact_id="$(jq -r '.artifacts[] | select(.name == "JellyfinDesktop-v2.0.0-windows-x64-r5") | .id' <<<"$artifact_json" | head -n 1)"

          if [ -z "$artifact_id" ]; then
            echo "Source Actions artifact is already absent; nothing to delete."
            exit 0
          fi

          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          echo "Deleted source Actions artifact $artifact_id after verifying durable release $TAG."
