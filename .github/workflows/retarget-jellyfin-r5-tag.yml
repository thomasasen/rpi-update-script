name: Retarget Jellyfin R5 release tag

on:
  push:
    branches:
      - build/jellyfin-desktop-v2.0.0
    paths:
      - ".github/workflows/retarget-jellyfin-r5-tag.yml"

permissions:
  contents: write

jobs:
  retarget:
    runs-on: ubuntu-latest
    env:
      TAG: jellyfin-desktop-v2.0.0-windows-x64-r5
      TARGET_SHA: c925203426dbc1a4fd47adf1bc68084789111406
      EXPECTED_OLD_SHA: 26d46ad8c8953bfa518af13bdaa61e12e7d17465

    steps:
      - name: Checkout repository with tag write credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify current tag and retarget R5 via git
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          CURRENT_SHA="$(git rev-parse "refs/tags/$TAG")"

          if [ "$CURRENT_SHA" = "$TARGET_SHA" ]; then
            echo "Tag already points to intended R5 release commit: $TARGET_SHA"
            exit 0
          fi

          test "$CURRENT_SHA" = "$EXPECTED_OLD_SHA"
          git cat-file -e "$TARGET_SHA^{commit}"

          git tag -f "$TAG" "$TARGET_SHA"
          git push --force origin "refs/tags/$TAG"

          ACTUAL_SHA="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$TARGET_SHA"
          echo "Retargeted $TAG: $CURRENT_SHA -> $ACTUAL_SHA"
