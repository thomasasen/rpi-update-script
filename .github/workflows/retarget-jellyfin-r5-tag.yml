name: Retarget Jellyfin R5 release tag with release token

on:
  push:
    branches:
      - build/jellyfin-desktop-v2.0.0
    paths:
      - ".github/workflows/retarget-jellyfin-r5-tag.yml"

permissions:
  contents: read

jobs:
  retarget:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_WORKFLOW_TOKEN }}
      TAG: jellyfin-desktop-v2.0.0-windows-x64-r5
      TARGET_SHA: c925203426dbc1a4fd47adf1bc68084789111406
      EXPECTED_OLD_SHA: 26d46ad8c8953bfa518af13bdaa61e12e7d17465

    steps:
      - name: Verify release token exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RELEASE_WORKFLOW_TOKEN is missing or unavailable."
            exit 1
          fi

      - name: Retarget and verify R5 tag
        shell: bash
        run: |
          set -euo pipefail
          TAG_API="repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}"
          CURRENT_SHA="$(gh api "$TAG_API" --jq '.object.sha')"

          if [ "$CURRENT_SHA" = "$TARGET_SHA" ]; then
            echo "Tag already points to intended R5 release commit: $TARGET_SHA"
          else
            test "$CURRENT_SHA" = "$EXPECTED_OLD_SHA"

            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="$TARGET_SHA" \
              -F force=true >/dev/null
          fi

          ACTUAL_SHA="$(gh api "$TAG_API" --jq '.object.sha')"
          test "$ACTUAL_SHA" = "$TARGET_SHA"
          echo "Verified $TAG -> $ACTUAL_SHA"

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.tag_name')"
          test "$RELEASE_TAG" = "$TAG"
          echo "Release remains attached to tag $RELEASE_TAG"
