name: Build Jellyfin Desktop v2.0.0 Windows x64

on:
  push:
    branches:
      - build/jellyfin-desktop-v2.0.0
    paths:
      - ".github/workflows/build-jellyfin-desktop-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win64:
    runs-on: windows-2022

    steps:
      - name: Checkout Jellyfin Desktop v2.0.0
        uses: actions/checkout@v4
        with:
          repository: jellyfin/jellyfin-desktop
          ref: v2.0.0
          submodules: recursive
          fetch-depth: 0

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "1634d3d263b881dccc62bf278d1289b471ec7af1"
          test "$(git describe --tags --exact-match)" = "v2.0.0"
          echo "Building exact Jellyfin Desktop v2.0.0 commit: $(git rev-parse HEAD)"

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          arch: "win64_msvc2022_64"
          modules: "qtwebengine"

      - name: Install dependencies
        shell: bash
        run: |
          mkdir build
          curl -L https://aka.ms/vs/17/release/vc_redist.x64.exe > vc_redist.x64.exe
          sed -i 's#C:\\Program Files (x86)\\Microsoft Visual Studio\\2019\\BuildTools\\VC\\Redist\\MSVC\\v142\\vcredist_x64.exe#'"$(readlink -f vc_redist.x64.exe | sed 's#/\([a-z]\)/#\1:\\#g' | tr '/' '\\' | sed 's/\\/\\\\/g')#g" bundle/win/Bundle.wxs
          curl -L https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-win.zip > ninja.zip
          unzip ninja.zip
          mv ninja.exe build/
          curl -L https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-x86_64-v3-20240304-git-9ac791c.7z/download > mpv.7z
          7z x mpv.7z
          mkdir mpv
          mv include mpv
          gendef libmpv-2.dll
          mv libmpv-2.dll mpv/libmpv-2.dll
          mv libmpv-2.def mpv.def
          mv mpv.def libmpv.dll.a mpv/
          mv mpv build/

      - name: Build exact v2.0.0 Windows x64 installer
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd build
          set PATH=%PATH%;C:\Program Files (x86)\WiX Toolset v3.11\bin;%CD%
          lib /def:mpv\mpv.def /out:mpv\libmpv-2.dll.lib /MACHINE:X64
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=output -DCMAKE_MAKE_PROGRAM=ninja.exe -DQTROOT=%Qt6_DIR% -DMPV_INCLUDE_DIR=mpv/include -DMPV_LIBRARY=mpv/libmpv-2.dll.lib -DUSE_STATIC_MPVQT=ON -DCHECK_FOR_UPDATES=ON ..
          ninja
          ninja windows_package

      - name: Show produced installer
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Filter "JellyfinDesktop-*.exe" | Format-Table Name,Length,LastWriteTime
          if (-not (Get-ChildItem -Path build -Filter "JellyfinDesktop-*.exe")) { throw "No installer produced" }

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: JellyfinDesktop-v2.0.0-windows-x64
          path: ${{ github.workspace }}/build/JellyfinDesktop-*.exe
          if-no-files-found: error
          retention-days: 7
