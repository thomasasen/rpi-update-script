name: Build Jellyfin Desktop v2.0.0 Windows x64 R5

on:
  push:
    branches:
      - build/jellyfin-desktop-v2.0.0
    paths:
      - ".github/workflows/build-jellyfin-desktop-v2.yml"
  workflow_dispatch:

concurrency:
  group: jellyfin-desktop-v2-windows-build
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  build-win64:
    runs-on: windows-2022

    steps:
      - name: Checkout Jellyfin Desktop v2.0.0
        uses: actions/checkout@v4
        with:
          repository: jellyfin/jellyfin-desktop
          ref: v2.0.0
          submodules: recursive
          fetch-depth: 0

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "1634d3d263b881dccc62bf278d1289b471ec7af1"
          test "$(git describe --tags --exact-match)" = "v2.0.0"
          echo "Building exact Jellyfin Desktop v2.0.0 commit: $(git rev-parse HEAD)"

      - name: Apply Jellyfin upstream Windows v2.0.0 build fix
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin 52d506767613e41a889c75e8bbaf00c51a29751b
          rc=0
          git -c user.name="Build Bot" -c user.email="build@localhost" cherry-pick --no-commit 52d506767613e41a889c75e8bbaf00c51a29751b || rc=$?
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "src/main.cpp"
            git checkout --ours -- src/main.cpp
            git add src/main.cpp
            git cherry-pick --quit
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          test "$(tr -d '\r\n' < VERSION)" = "2.0.0"
          git diff --cached --check
          git -c user.name="Build Bot" -c user.email="build@localhost" commit -m "Apply Jellyfin Windows v2.0.0 build fix"
          echo "Applied Jellyfin's Windows v2.0.0 build fix"

      - name: Apply Jellyfin upstream OpenGL black-screen fix
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin 8a5b0d4e4d55e2e85ab8334bf75cbc6fa386b5dc
          rc=0
          git -c user.name="Build Bot" -c user.email="build@localhost" cherry-pick --no-commit 8a5b0d4e4d55e2e85ab8334bf75cbc6fa386b5dc || rc=$?
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "src/main.cpp"
            git checkout --theirs -- src/main.cpp
            git add src/main.cpp
            git cherry-pick --quit
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          test "$(tr -d '\r\n' < VERSION)" = "2.0.0"
          ! grep -q "AA_UseOpenGLES" src/main.cpp
          grep -q "Using native desktop OpenGL" src/player/OpenGLDetect.cpp
          git diff --cached --check
          git -c user.name="Build Bot" -c user.email="build@localhost" commit -m "Apply Jellyfin OpenGL black-screen fix"
          echo "Applied official Jellyfin commit 8a5b0d4: Fix OpenGL detect"

      - name: Apply QtWebEngine flicker workaround
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/main.cpp")
          text = path.read_text(encoding="utf-8")
          old = '''QStringList g_qtFlags = {
            "--enable-gpu-rasterization",
            "--disable-features=MediaSessionService"
          };'''
          new = '''QStringList g_qtFlags = {
          #ifdef Q_OS_WIN32
            "--disable-gpu",
          #else
            "--enable-gpu-rasterization",
          #endif
            "--disable-features=MediaSessionService"
          };'''

          if old not in text:
              raise SystemExit("Expected QtWebEngine flag block not found")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          test "$(tr -d '\r\n' < VERSION)" = "2.0.0"
          grep -q '"--disable-gpu"' src/main.cpp
          grep -q '#ifdef Q_OS_WIN32' src/main.cpp
          git diff --check
          git add src/main.cpp
          git -c user.name="Build Bot" -c user.email="build@localhost" commit -m "Apply Windows QtWebEngine flicker workaround"
          echo "Windows QtWebEngine GPU acceleration is disabled by default; MPV/OpenGL video rendering remains unchanged"

      - name: Apply QtWebEngine disk cache and split WebEngine paths
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          qml = Path("src/ui/webview.qml")
          qml_text = qml.read_text(encoding="utf-8")
          qml_old = "profile.httpCacheType: WebEngineProfile.MemoryHttpCache"
          qml_new = "profile.httpCacheType: WebEngineProfile.DiskHttpCache"
          if qml_text.count(qml_old) != 1:
              raise SystemExit(f"Expected exactly one MemoryHttpCache marker, found {qml_text.count(qml_old)}")
          qml.write_text(qml_text.replace(qml_old, qml_new, 1), encoding="utf-8")

          main = Path("src/main.cpp")
          main_text = main.read_text(encoding="utf-8")
          main_old = "\n".join([
              '      QString webEngineDir = Paths::dataDir("QtWebEngine");',
              '      QWebEngineProfile* defaultProfile = QWebEngineProfile::defaultProfile();',
              '      defaultProfile->setCachePath(webEngineDir);',
              '      defaultProfile->setPersistentStoragePath(webEngineDir);',
          ])
          main_new = "\n".join([
              '      QWebEngineProfile* defaultProfile = QWebEngineProfile::defaultProfile();',
              '      defaultProfile->setCachePath(Paths::cacheDir("QtWebEngine"));',
              '      defaultProfile->setPersistentStoragePath(Paths::dataDir("QtWebEngine"));',
          ])
          if main_text.count(main_old) != 1:
              raise SystemExit(f"Expected exactly one legacy WebEngine path block, found {main_text.count(main_old)}")
          main.write_text(main_text.replace(main_old, main_new, 1), encoding="utf-8")
          PY

          test "$(tr -d '\r\n' < VERSION)" = "2.0.0"
          grep -q 'profile.httpCacheType: WebEngineProfile.DiskHttpCache' src/ui/webview.qml
          ! grep -q 'profile.httpCacheType: WebEngineProfile.MemoryHttpCache' src/ui/webview.qml
          grep -q 'setCachePath(Paths::cacheDir("QtWebEngine"))' src/main.cpp
          grep -q 'setPersistentStoragePath(Paths::dataDir("QtWebEngine"))' src/main.cpp
          git diff --check
          git add src/ui/webview.qml src/main.cpp
          git -c user.name="Build Bot" -c user.email="build@localhost" commit -m "Use QtWebEngine disk cache with separate cache path"
          echo "QtWebEngine now uses DiskHttpCache; persistent WebEngine storage stays in the existing data path"

      - name: Verify retained v2.0.0 fixes
        shell: bash
        run: |
          set -euxo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "2.0.0"
          ! grep -q "AA_UseOpenGLES" src/main.cpp
          grep -q "Using native desktop OpenGL" src/player/OpenGLDetect.cpp
          grep -q '"--disable-gpu"' src/main.cpp
          grep -q '#ifdef Q_OS_WIN32' src/main.cpp
          grep -q 'profile.httpCacheType: WebEngineProfile.DiskHttpCache' src/ui/webview.qml
          ! grep -q 'profile.httpCacheType: WebEngineProfile.MemoryHttpCache' src/ui/webview.qml
          grep -q 'setCachePath(Paths::cacheDir("QtWebEngine"))' src/main.cpp
          grep -q 'setPersistentStoragePath(Paths::dataDir("QtWebEngine"))' src/main.cpp
          test -z "$(git diff --name-only --diff-filter=U)"
          echo "Verified Jellyfin v2.0.0 and retained Windows/OpenGL/QtWebEngine fixes plus R5 disk-cache paths"

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.3"
          arch: "win64_msvc2022_64"
          modules: "qtwebengine qtwebchannel qtpositioning"

      - name: Verify Qt 6.9.3
        shell: pwsh
        run: |
          $qmakeOutput = (& qmake --version 2>&1 | Out-String)
          Write-Host $qmakeOutput
          if ($LASTEXITCODE -ne 0) {
            throw "qmake --version failed with exit code $LASTEXITCODE"
          }
          if ($qmakeOutput -notmatch 'Using Qt version 6\.9\.3(?:\s|$)') {
            throw "Expected Qt 6.9.3, but qmake reported a different version"
          }
          Write-Host "Verified Qt 6.9.3 from qmake"

      - name: Install dependencies
        shell: bash
        run: |
          mkdir build
          curl -L https://aka.ms/vs/17/release/vc_redist.x64.exe > vc_redist.x64.exe
          curl -L https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-win.zip > ninja.zip
          unzip ninja.zip
          mv ninja.exe build/
          curl -L https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-x86_64-v3-20240304-git-9ac791c.7z/download > mpv.7z
          7z x mpv.7z
          mkdir mpv
          mv include mpv
          gendef libmpv-2.dll
          mv libmpv-2.dll mpv/libmpv-2.dll
          mv libmpv-2.def mpv.def
          mv mpv.def libmpv.dll.a mpv/
          mv mpv build/

      - name: Build exact v2.0.0 Windows x64 installer
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd build
          set PATH=%PATH%;C:\Program Files (x86)\WiX Toolset v3.11\bin;%CD%
          lib /def:mpv\mpv.def /out:mpv\libmpv-2.dll.lib /MACHINE:X64
          cmake -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=output -DCMAKE_MAKE_PROGRAM=ninja.exe -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DCMAKE_CXX_FLAGS=/MD -DCMAKE_C_FLAGS=/MD -DQTROOT=%QT_ROOT_DIR% -DMPV_INCLUDE_DIR=mpv/include -DMPV_LIBRARY=mpv/libmpv-2.dll -DUSE_STATIC_MPVQT=ON -DCHECK_FOR_UPDATES=OFF ..
          ninja
          ninja install
          copy /Y ..\vc_redist.x64.exe output\vc_redist.x64.exe
          ninja windows_package

      - name: Show produced installer
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Filter "JellyfinDesktop-*.exe" | Format-Table Name,Length,LastWriteTime
          if (-not (Get-ChildItem -Path build -Filter "JellyfinDesktop-*.exe")) { throw "No installer produced" }

      - name: Remove older Jellyfin test artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const prefix = 'JellyfinDesktop-v2.0.0-windows-x64';
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            const stale = artifacts.filter(
              artifact => !artifact.expired && artifact.name.startsWith(prefix)
            );

            for (const artifact of stale) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
              core.info(`Deleted older test artifact ${artifact.name} (${artifact.id})`);
            }

            core.info(`Removed ${stale.length} older Jellyfin test artifact(s).`);

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: JellyfinDesktop-v2.0.0-windows-x64-r5
          path: ${{ github.workspace }}/build/JellyfinDesktop-*.exe
          if-no-files-found: error
          retention-days: 1
